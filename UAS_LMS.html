<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Pintar - Premium Pink Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #880e4f;
            --primary-light: #fce4ec;
            --bg-color: #fff0f5;
            --surface: #ffffff;
            --text: #2c001e;
            --text-light: #6a4f5f;
            --border: #f8bbd0;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        /* --- TOAST NOTIFICATION CUSTOM --- */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: var(--surface);
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.15);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            min-width: 280px;
            animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- CUSTOM MODAL CONFIRMATION --- */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 0, 30, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1500;
        }
        .custom-modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(216, 27, 96, 0.2);
            text-align: center;
        }
        .custom-modal h3 { color: var(--primary-dark); margin-bottom: 12px; font-size: 18px; }
        .custom-modal p { color: var(--text-light); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .modal-btn-ok { background-color: var(--primary); color: white; }
        .modal-btn-ok:hover { background-color: var(--primary-dark); }
        .modal-btn-cancel { background-color: #e0e0e0; color: #333; }

        /* --- AUTH STYLE --- */
        .auth-container { display: flex; flex: 1; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(216, 27, 96, 0.1); }
        .auth-card h2 { color: var(--primary-dark); text-align: center; margin-bottom: 24px; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text-light); }
        .role-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        .form-group input:focus { border-color: var(--primary); }
        .btn-submit, .btn-nav { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; }
        .btn-submit:hover, .btn-nav:hover { background-color: var(--primary-dark); }
        .auth-toggle { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-light); }
        .auth-toggle a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .error-msg { color: #d93025; background-color: #fce8e6; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; text-align: center; border: 1px solid #f9dad5; }
        .success-screen { display: none; flex-direction: column; align-items: center; text-align: center; padding: 20px 0; }
        .success-icon { font-size: 48px; margin-bottom: 16px; }
        .success-title { color: var(--primary-dark); font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .success-desc { color: var(--text-light); font-size: 14px; margin-bottom: 24px; }

        /* --- GLOBAL DASHBOARD LAYOUT --- */
        .dashboard { display: none; flex-direction: column; min-height: 100vh; }
        .top-app-bar { background-color: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .top-bar-main { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .logout-btn { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .logout-btn:hover { background-color: var(--primary); color: white; }
        
        .main-layout { display: flex; flex: 1; }
        .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 10px; }
        .sidebar-menu { list-style: none; }
        .sidebar-item { padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; color: var(--text-light); cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .sidebar-item:hover, .sidebar-item.active { background-color: var(--primary-light); color: var(--primary-dark); }
        .content-area { flex: 1; padding: 24px; overflow-y: auto; }

        /* --- KELAS VIEW COMPONENT --- */
        .class-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
        .class-box { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: var(--transition); }
        .class-box:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(216,27,96,0.1); }
        .class-box h3 { color: var(--primary-dark); font-size: 24px; margin-bottom: 8px; }
        
        .room-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; height: 580px; }
        .room-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff5f8; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .room-body { flex: 1; display: flex; overflow: hidden; }
        .chat-section { flex: 1.6; display: flex; flex-direction: column; border-right: 1px solid var(--border); padding: 16px; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg-bubble.dosen-msg { background-color: var(--primary-light); color: var(--primary-dark); align-self: flex-start; border-top-left-radius: 0; }
        .msg-bubble .sender { font-weight: bold; font-size: 11px; display: block; margin-bottom: 2px; }
        .chat-input-area { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        
        .room-panels { flex: 1.4; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; background: #fffbfe; }
        .panel-section { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .panel-section h4 { color: var(--primary-dark); margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        
        /* --- LIST INTERAKTIF --- */
        .item-list-view { list-style: none; font-size: 13px; }
        .item-list-view li { 
            padding: 10px 12px; 
            border-bottom: 1px dashed var(--border); 
            color: var(--text-light); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            gap: 12px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .item-list-view li:last-child { border: none; }
        .item-content-text { flex: 1; word-break: break-word; line-height: 1.4; }
        .dosen-panel-active .item-list-view li:hover { background-color: #fff0f5; }
        .hover-actions { display: none; gap: 6px; flex-shrink: 0; }
        .dosen-panel-active .item-list-view li:hover .hover-actions { display: flex; }

        .action-inline-btn { border: none; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; color: white; transition: opacity 0.2s; }
        .action-inline-btn:hover { opacity: 0.9; }
        .btn-inline-edit { background-color: #0288d1; }
        .btn-inline-delete { background-color: #d32f2f; }

        .inline-edit-wrapper { display: flex; width: 100%; gap: 6px; }
        .inline-edit-input { flex: 1; padding: 6px; border: 1px solid var(--primary); border-radius: 4px; font-size: 13px; outline: none; }

        /* --- ABSENSI ATTENDEES LOG LIST --- */
        .absen-log-container {
            margin-top: 10px;
            background: var(--bg-color);
            border-radius: 6px;
            padding: 8px;
            max-height: 90px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .absen-log-title { font-size: 11px; font-weight: bold; color: var(--primary-dark); margin-bottom: 4px; text-transform: uppercase; }
        .absen-log-list { list-style: none; font-size: 12px; color: var(--text); padding-left: 4px; }
        .absen-log-list li { padding: 2px 0; border-bottom: 1px solid #fce4ec; }
        .absen-log-list li:last-child { border: none; }

        /* --- OTHER FORMS --- */
        .form-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; max-width: 500px; }
        .form-box textarea, .form-box select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; margin-bottom: 12px; resize: none; font-family: inherit; }
        .form-actions-row { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 10px; background: #e0e0e0; color: #333; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .absen-btn { background-color: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; }
        .absen-btn:disabled { background-color: #b0bec5; cursor: not-allowed; }

        .grade-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        .grade-table th, .grade-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        .grade-table th { background-color: var(--primary-light); color: var(--primary-dark); }
        .grade-table input[type="number"] { width: 60px; padding: 4px; border: 1px solid var(--border); border-radius: 4px; }
        .btn-save-grade { background-color: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
